[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "2.2.2"
wasm-bindgen = "0.2.114"

# Bridge Rust's `rand` / `getrandom` to the browser's WebCrypto API
getrandom = { version = "0.4.2", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Mobile coin crypto
hkdf = "0.12.4"
slip10_ed25519 = "0.1.3"
curve25519-dalek = "4.1.3"
sha2 = "0.10.9"

[[bin]]
name = "wasm"
path = "main.rs"
