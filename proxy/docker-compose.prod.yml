# Production Envoy gRPC-Web proxy for DDEX.
# Binds to 127.0.0.1:8080 — nginx reverse-proxies /test/* and /prod/* here.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  envoy:
    build:
      context: .
    env_file: .env.prod
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml.tmpl:ro
    command: >
      sh -c 'envsubst < /etc/envoy/envoy.yaml.tmpl > /tmp/envoy.yaml &&
             envoy -c /tmp/envoy.yaml --log-level $${ENVOY_LOG_LEVEL:-info}'
