# Envoy gRPC-Web proxy for MobileCoin — see README.md for full explanation.
# All ${...} vars are expanded by envsubst at container startup (from .env).
static_resources:
  listeners:
    - name: grpc_web_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: ${ENVOY_PORT}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_web
                codec_type: AUTO
                internal_address_config:
                  unix_sockets: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% → %UPSTREAM_HOST% %RESPONSE_CODE% %DURATION%ms\n"
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: proxy
                      domains: ["*"]
                      routes:
                        # === Testnet ===
                        - match:
                            prefix: "/test/fog/"
                          route:
                            cluster: fog_test_cluster
                            prefix_rewrite: "/"
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                        - match:
                            prefix: "/test/consensus/"
                          route:
                            cluster: consensus_test_cluster
                            prefix_rewrite: "/"
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                        # === Mainnet ===
                        - match:
                            prefix: "/prod/fog/"
                          route:
                            cluster: fog_prod_cluster
                            prefix_rewrite: "/"
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                        - match:
                            prefix: "/prod/consensus/"
                          route:
                            cluster: consensus_prod_cluster
                            prefix_rewrite: "/"
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                      # CORS — allows cross-origin gRPC-Web requests from the frontend
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - prefix: "*"
                          allow_methods: "GET, PUT, DELETE, POST, OPTIONS"
                          allow_headers: "keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout"
                          expose_headers: "grpc-status,grpc-message,grpc-status-details-bin"
                          max_age: "1728000"
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # Upstream clusters — HTTP/2 + TLS to MobileCoin services
  clusters:
    # === Testnet Fog ===
    - name: fog_test_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: ${MC_TEST_FOG_HOST}
      load_assignment:
        cluster_name: fog_test_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${MC_TEST_FOG_HOST}
                      port_value: ${MC_TEST_FOG_PORT}

    # === Testnet Consensus ===
    - name: consensus_test_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: ${MC_TEST_CONSENSUS_HOST}
      load_assignment:
        cluster_name: consensus_test_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${MC_TEST_CONSENSUS_HOST}
                      port_value: ${MC_TEST_CONSENSUS_PORT}

    # === Mainnet Fog ===
    - name: fog_prod_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: ${MC_PROD_FOG_HOST}
      load_assignment:
        cluster_name: fog_prod_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${MC_PROD_FOG_HOST}
                      port_value: ${MC_PROD_FOG_PORT}

    # === Mainnet Consensus ===
    - name: consensus_prod_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: ${MC_PROD_CONSENSUS_HOST}
      load_assignment:
        cluster_name: consensus_prod_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${MC_PROD_CONSENSUS_HOST}
                      port_value: ${MC_PROD_CONSENSUS_PORT}
