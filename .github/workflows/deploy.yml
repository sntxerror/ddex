name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        default: 'dev'

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Auto-deploy: only after successful CI on dev
    # Manual: always runs
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'dev' }}
          sparse-checkout: |
            proxy/
            deploy/
            scripts/deploy.sh

      # --- Get the frontend build artifact ---
      # From the CI run that triggered us
      - name: Download artifact from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For manual dispatch: find the latest successful CI artifact on dev
      - name: Download latest CI artifact (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest successful CI run on dev
          RUN_ID=$(gh run list --workflow CI --branch dev --status success --limit 1 --json databaseId -q '.[0].databaseId' --repo ${{ github.repository }})
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful CI run found on dev. Push to dev first."
            exit 1
          fi
          echo "Using CI run: $RUN_ID"
          gh run download "$RUN_ID" --name frontend-dist --dir frontend-dist/ --repo ${{ github.repository }}

      # --- SSH setup ---
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # --- Upload files ---
      - name: Prepare server
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh ubuntu@$HOST \
            'sudo mkdir -p /opt/ddex/frontend /opt/ddex/proxy && sudo chown -R ubuntu:ubuntu /opt/ddex'

      - name: Upload frontend
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          tar -czf /tmp/frontend.tar.gz -C frontend-dist .
          scp /tmp/frontend.tar.gz ubuntu@$HOST:/tmp/frontend.tar.gz
          ssh ubuntu@$HOST \
            'rm -rf /opt/ddex/frontend/* && tar -xzf /tmp/frontend.tar.gz -C /opt/ddex/frontend && rm /tmp/frontend.tar.gz'

      - name: Upload proxy config
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          tar -czf /tmp/proxy.tar.gz -C proxy Dockerfile envoy.yaml docker-compose.prod.yml .env.prod
          scp /tmp/proxy.tar.gz ubuntu@$HOST:/tmp/proxy.tar.gz
          ssh ubuntu@$HOST \
            'tar -xzf /tmp/proxy.tar.gz -C /opt/ddex/proxy && rm /tmp/proxy.tar.gz'

      - name: Upload nginx config
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          scp deploy/nginx/privatesecure.org ubuntu@$HOST:/tmp/nginx-privatesecure.org
          ssh ubuntu@$HOST \
            'sudo cp /tmp/nginx-privatesecure.org /etc/nginx/sites-available/privatesecure.org && rm /tmp/nginx-privatesecure.org'

      # --- Run deploy ---
      - name: Deploy
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh ubuntu@$HOST 'bash -s' < scripts/deploy.sh

      - name: Verify
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://privatesecure.org/)
          echo "HTTPS status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Site returned HTTP $STATUS"
          fi
