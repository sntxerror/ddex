name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: wasm-pack build crates/wallet-core --target web --out-dir ../../frontend/src/wasm

      - name: Copy WASM binary to public
        run: |
          mkdir -p frontend/public/wasm
          cp frontend/src/wasm/wallet_core_bg.wasm frontend/public/wasm/wallet_core_bg.wasm

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-core-wasm
          path: |
            frontend/src/wasm/
            frontend/public/wasm/

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wallet-core-wasm

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
