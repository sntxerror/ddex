[package]
name = "wallet-core"
version = "0.1.0"
edition = "2021"
description = "MobileCoin WASM wallet core - Phase 0 POC"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

# ── Phase 0: confirmed WASM-safe crates ──────────────────────────────────────

# BIP-39 mnemonic generation and parsing
bip39 = "2.0"

# Bridge Rust's `rand` / `getrandom` to the browser's WebCrypto API
getrandom = { version = "0.2", features = ["js"] }

# Cryptographic primitives used by MobileCoin internally
hmac     = { version = "0.12", default-features = false }
sha2     = { version = "0.10", default-features = false }
hkdf     = { version = "0.12", default-features = false }

# Ristretto255 group operations (MobileCoin's on-chain key type)
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

# Base58 encoding for MobileCoin public addresses
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

# Hex encoding for debug output
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
