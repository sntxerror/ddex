[package]
name = "wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bip39 = "2.2.2"
bs58 = "0.5"
crc32fast = "1.4"
wasm-bindgen = "=0.2.114"

# Bridge Rust's `rand` / `getrandom` to the browser's WebCrypto API
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Mobile coin crypto
hkdf = "0.12.4"
slip10_ed25519 = "0.1.3"
sha2 = "0.10.9"
blake2 = "0.10.6"
merlin = "3.0.0"
rand_hc = "0.3"
rand_core = "0.6"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables"] }
schnorrkel-og = { git = "https://github.com/mobilecoinfoundation/schnorrkel.git", rev = "049bf9d30f3bbe072e2ad1b5eefdf0f3c851215e", default-features = false }
hmac = "0.12.1"
aes-gcm = "0.10.3"
sha3 = "0.10.8"
prost = "0.13"

[dependencies.web-sys]
version = "0.3"
features = ["console"]
